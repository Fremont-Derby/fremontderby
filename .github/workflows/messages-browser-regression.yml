name: Messages browser regression
on:
  pull_request:
    paths:
      - 'src/chatPage.js'
      - 'src/messagesTheme.js'
      - 'browser/jfl/messages-thread-switch.spec.js'
      - '.github/workflows/messages-browser-regression.yml'
  push:
    branches: [fremontderby-jfl]
    paths:
      - 'src/chatPage.js'
      - 'src/messagesTheme.js'
      - 'browser/jfl/messages-thread-switch.spec.js'
      - '.github/workflows/messages-browser-regression.yml'
permissions:
  contents: read
jobs:
  messages-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_MESSAGES_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser/jfl/messages-thread-switch.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: messages-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
