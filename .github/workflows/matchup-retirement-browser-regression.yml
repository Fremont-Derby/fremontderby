name: Matchup retirement browser regression
on:
  pull_request:
    paths:
      - 'src/chatPage.js'
      - 'src/chatHttp.js'
      - 'src/jflModernSchedule.js'
      - 'browser/jfl/matchup-chat-retirement.spec.js'
      - 'supabase/migrations/*jfl_retire_matchup_chat.sql'
      - '.github/workflows/matchup-retirement-browser-regression.yml'
  push:
    branches: [fremontderby-jfl]
    paths:
      - 'src/chatPage.js'
      - 'src/chatHttp.js'
      - 'src/jflModernSchedule.js'
      - 'browser/jfl/matchup-chat-retirement.spec.js'
      - 'supabase/migrations/*jfl_retire_matchup_chat.sql'
      - '.github/workflows/matchup-retirement-browser-regression.yml'
permissions:
  contents: read
jobs:
  matchup-retirement-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_RETIREMENT_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser/jfl/matchup-chat-retirement.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: matchup-retirement-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
