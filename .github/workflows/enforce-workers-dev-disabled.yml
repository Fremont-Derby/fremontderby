name: Enforce workers.dev disabled

on:
  push:
    branches: [main]
    paths:
      - wrangler.jsonc
      - scripts/disable-workers-dev.mjs
      - .github/workflows/enforce-workers-dev-disabled.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enforce-workers-dev-disabled
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disable workers.dev routes and preview URLs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/disable-workers-dev.mjs
