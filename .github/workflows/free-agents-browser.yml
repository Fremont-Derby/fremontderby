name: Free-agent recovery browser regression
on:
  pull_request:
    paths: ['src/jflFreeAgentsPage.js', 'src/jflModernShell.js', 'browser/jfl/free-agents-recovery.spec.js', 'playwright.free-agents.config.mjs', '.github/workflows/free-agents-browser.yml']
  push:
    branches: [fremontderby-jfl]
    paths: ['src/jflFreeAgentsPage.js', 'src/jflModernShell.js', 'browser/jfl/free-agents-recovery.spec.js', 'playwright.free-agents.config.mjs', '.github/workflows/free-agents-browser.yml']
permissions:
  contents: read
jobs:
  free-agents-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_FREE_AGENTS_SOURCE: bundled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config playwright.free-agents.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: free-agents-browser-failure
          path: test-results/free-agents/
          retention-days: 7
