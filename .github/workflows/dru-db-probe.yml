name: DRU database probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'Fremont-Derby/fremontderby'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only staging probe
        env:
          SUPABASE_ACCESS_TOKEN2: ${{ secrets.SUPABASE_ACCESS_TOKEN2 }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN2" ]; then
            echo "secret missing"
            exit 1
          fi
          echo "secret present, length ${#SUPABASE_ACCESS_TOKEN2}"
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
            -X POST \
            -H "authorization: Bearer $SUPABASE_ACCESS_TOKEN2" \
            -H 'content-type: application/json' \
            --data '{"query":"select nspname from pg_namespace where nspname in ('"'"'dru'"'"','"'"'jfl'"'"','"'"'gamma'"'"') order by 1"}' \
            'https://api.supabase.com/v1/projects/oqkkvqkerusepyokzbmt/database/query')
          echo "http $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "probe failed"
            # print only status, not body, in case the body echoes input
            exit 1
          fi
          node -e 'const rows=JSON.parse(require("fs").readFileSync("/tmp/probe.json","utf8")); console.log(rows.map(r=>r.nspname).join(","))'
