name: Staging readiness

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: Public URL of the deployed staging Worker, without a trailing slash
        required: true
        type: string
      expected_version_tag:
        description: Git SHA expected from /health; defaults to the commit used to start this workflow
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-readiness-${{ github.event.inputs.staging_url || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted staging Worker and environment
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          EXPECTED_VERSION_TAG: ${{ inputs.expected_version_tag || github.sha }}
        run: |
          set +e
          node scripts/smoke-release.mjs "$STAGING_BASE_URL" staging "$EXPECTED_VERSION_TAG" 2>&1 | tee smoke-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Record successful staging readiness proof
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          EXPECTED_VERSION_TAG: ${{ inputs.expected_version_tag || github.sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Hosted staging readiness passed for \`${process.env.EXPECTED_VERSION_TAG}\`.`,
              '',
              `Workflow: ${runUrl}`,
              `Staging URL: \`${process.env.STAGING_BASE_URL}\``,
              '',
              'Verified automatically:',
              '- `/health` reported the expected Git SHA as `versionTag`;',
              '- `/health/environment` reported `staging` with all readiness checks green;',
              '- the Worker is therefore bound to the configured staging Supabase project and has its server-only service-role credential available;',
              '- `/demo` served the current Try a League Night surface.',
              '',
              'This is hosted Worker/runtime evidence. Database migration parity and production release proof remain separate checks.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 35,
              body,
            });
      - name: Record actionable staging readiness failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          EXPECTED_VERSION_TAG: ${{ inputs.expected_version_tag || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let diagnostics = 'Smoke output was unavailable.';
            try {
              diagnostics = fs.readFileSync('smoke-output.txt', 'utf8').trim().slice(-6000) || diagnostics;
            } catch {}
            diagnostics = diagnostics.replace(/```/g, '``\u200b`');
            const body = [
              `Hosted staging readiness failed for expected commit \`${process.env.EXPECTED_VERSION_TAG}\`.`,
              '',
              `Workflow: ${runUrl}`,
              `Staging URL: \`${process.env.STAGING_BASE_URL}\``,
              '',
              'Expected proof:',
              '- `/health` reports the expected Git SHA;',
              '- `/health/environment` reports `staging` and all readiness checks pass;',
              '- `/demo` serves the current test-drive surface.',
              '',
              'Observed diagnostics:',
              '```text',
              diagnostics,
              '```',
              '',
              'Keep #35 open until hosted staging reports the staging environment/project and server-only service-role readiness.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 35,
              body,
            });
      - name: Fail staging readiness validation
        if: steps.smoke.outcome == 'failure'
        run: exit 1
