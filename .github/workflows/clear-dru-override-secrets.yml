name: Clear stale DRU override secrets

on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: [ubuntu-latest, self-hosted]

concurrency:
  group: clear-dru-override-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clear:
    runs-on: ${{ inputs.runner_target || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete stale URL, publishable, and project-ref secrets on fremontderby-dru
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/clear-dru-override-secrets.mjs
