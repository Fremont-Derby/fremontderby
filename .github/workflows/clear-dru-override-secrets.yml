name: Clear stale DRU override secrets

on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: [ubuntu-latest, self-hosted]

concurrency:
  group: clear-dru-override-secrets
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  clear:
    runs-on: ${{ inputs.runner_target || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete stale URL, publishable, and project-ref secrets on fremontderby-dru
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/clear-dru-override-secrets.mjs
      - name: Record result on #1761 and #2124
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "const token=process.env.GITHUB_TOKEN;const sha=process.env.GITHUB_SHA;const status=process.env.CLEAR_STATUS||'see job log';const body='Clear stale DRU override secrets workflow ran from `'+sha+'`. This step does not deploy. Next: merge #2123 onto `fremontderby-dru`, redeploy that branch only, then require HTTP 200 from https://dru.fremontderby.com/health/environment.'; for (const n of [1761,2124]) { fetch('https://api.github.com/repos/Fremont-Derby/fremontderby/issues/'+n+'/comments',{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({body})}).then(r=>console.log('comment',n,r.status)); }"
