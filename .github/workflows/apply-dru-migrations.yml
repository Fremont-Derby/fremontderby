name: Apply DRU migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fremontderby-dru
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the two DRU migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: oqkkvqkerusepyokzbmt
        run: node scripts/apply-dru-migrations.mjs
