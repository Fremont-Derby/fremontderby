name: Apply DRU migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql when missing
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply the two DRU migrations
        env:
          GAMMA_DATABASE_URL: ${{ secrets.GAMMA_DATABASE_URL }}
          SUPABASE_PROJECT_REF: oqkkvqkerusepyokzbmt
        run: node scripts/apply-dru-migrations.mjs
