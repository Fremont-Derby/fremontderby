name: Player directory season browser regression
on:
  pull_request:
    paths:
      - 'src/jflPlayersDirectory.js'
      - 'src/publicSeasonSelection.js'
      - 'browser/jfl/player-directory-season.spec.js'
      - '.github/workflows/player-directory-browser.yml'
  push:
    branches: [fremontderby-jfl]
    paths:
      - 'src/jflPlayersDirectory.js'
      - 'src/publicSeasonSelection.js'
      - 'browser/jfl/player-directory-season.spec.js'
      - '.github/workflows/player-directory-browser.yml'
permissions:
  contents: read
jobs:
  directory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_DIRECTORY_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser/jfl/player-directory-season.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: directory-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
