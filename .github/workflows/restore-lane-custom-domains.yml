name: Restore lane custom domains
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'I understand this break-glass action mutates Worker custom-domain bindings'
        required: true
        type: boolean
        default: false
concurrency:
  group: restore-lane-custom-domains
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require explicit mutation confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo 'Refusing to mutate custom domains without explicit confirmation.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach hostnames to correct Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/restore-lane-custom-domains.mjs
      - name: Assert lane environment identities
        run: node scripts/assert-lane-health.mjs
