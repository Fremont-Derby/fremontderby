name: Restore lane custom domains

on:
  workflow_dispatch:
  schedule:
    # Domains have been observed dropping; keep lanes attached and verify them.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: restore-lane-custom-domains
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach dru/jfl/gamma hostnames to matching Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/restore-lane-custom-domains.mjs
      - name: Verify public lane identity and readiness
        env:
          RELEASE_SMOKE_BYPASS_TOKEN: ${{ secrets.RELEASE_SMOKE_BYPASS_TOKEN }}
        run: node scripts/verify-lane-domain-health.mjs
