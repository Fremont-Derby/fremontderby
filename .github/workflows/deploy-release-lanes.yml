name: Deploy release lanes

# Test gate restored (#725). Manual dispatch only — does not depend on PR triggers (#724)
# still paused while hosted runners/billing recover (#723).
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane to deploy (jfl, dru, gamma, production, or all-lanes)'
        required: true
        default: 'gamma'
        type: choice
        options: [gamma, jfl, dru, production, all-lanes]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint and syntax check
        run: |
          set -euo pipefail
          npm run lint
          npm run check
      - name: Unit tests
        run: |
          set -euo pipefail
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ github.event.inputs.lane == 'all-lanes' && fromJson('["jfl","dru","gamma"]') || fromJson(format('["{0}"]', github.event.inputs.lane)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Deploy ${{ matrix.lane }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREMONT_ALLOW_LANE_DEPLOY_FROM_MAIN: '1'
          GITHUB_ACTIONS: 'true'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.lane }}" = "production" ]; then
            npm run deploy
          else
            npm run "deploy:${{ matrix.lane }}"
          fi
      - name: Probe host identity
        # Soft while #713 DNS/env may still flap; harden to fail-closed once lanes are green.
        continue-on-error: true
        run: |
          lane='${{ matrix.lane }}'
          if [ "$lane" = "production" ]; then
            host='fremontderby.com'
            expect='production'
          else
            host="${lane}.fremontderby.com"
            expect="$lane"
          fi
          node -e "
            const host = process.env.HOST;
            const expect = process.env.EXPECT;
            (async () => {
              const url = 'https://' + host + '/health/environment';
              const response = await fetch(url, { redirect: 'manual' });
              const text = await response.text();
              let body = {};
              try { body = JSON.parse(text); } catch {}
              const envName = body.environment || body.ENVIRONMENT || '';
              console.log(JSON.stringify({ host, status: response.status, environment: envName }));
              if (response.status !== 200 || String(envName) !== expect) {
                console.error('Probe identity mismatch (non-fatal until #713 closes)');
                process.exit(1);
              }
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          "
        env:
          HOST: ${{ matrix.lane == 'production' && 'fremontderby.com' || format('{0}.fremontderby.com', matrix.lane) }}
          EXPECT: ${{ matrix.lane == 'production' && 'production' || matrix.lane }}
