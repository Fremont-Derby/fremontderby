name: Deploy release lanes

# TEMPORARY (#692 / #679): No test job gate. This workflow only deploys.
# GitHub-hosted runners may still fail to allocate while billing limits apply.
# Revisit once Actions minutes/runners are healthy — do not treat this as permanent policy.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane to deploy (jfl, dru, gamma, production, or all-lanes)'
        required: true
        default: 'gamma'
        type: choice
        options: [gamma, jfl, dru, production, all-lanes]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ github.event.inputs.lane == 'all-lanes' && fromJson('["jfl","dru","gamma"]') || fromJson(format('["{0}"]', github.event.inputs.lane)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy ${{ matrix.lane }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREMONT_ALLOW_LANE_DEPLOY_FROM_MAIN: '1'
          GITHUB_ACTIONS: 'true'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.lane }}" = "production" ]; then
            npm run deploy
          else
            npm run "deploy:${{ matrix.lane }}"
          fi
      - name: Probe host (best-effort while DNS/lanes stabilize)
        # TEMPORARY: do not fail the deploy job solely on probe while dru/jfl DNS or env identity is incomplete.
        continue-on-error: true
        run: |
          lane='${{ matrix.lane }}'
          if [ "$lane" = "production" ]; then
            host='fremontderby.com'
            expect='production'
          else
            host="${lane}.fremontderby.com"
            expect="$lane"
          fi
          node -e "
          const host=process.env.HOST;
          const expect=process.env.EXPECT;
          fetch('https://'+host+'/health/environment').then(async r=>{
            const b=await r.json();
            console.log(JSON.stringify({host, ...b}));
            if(b.environment!==expect){
              console.error('Probe identity mismatch (non-fatal TEMP)');
              process.exit(1);
            }
          }).catch(e=>{console.error(e); process.exit(1);});
          "
        env:
          HOST: ${{ matrix.lane == 'production' && 'fremontderby.com' || format('{0}.fremontderby.com', matrix.lane) }}
          EXPECT: ${{ matrix.lane == 'production' && 'production' || matrix.lane }}
