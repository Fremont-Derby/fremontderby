name: Release source policy

# Fail-closed merge topology for #889 / #581. No deployment secrets.
on:
  pull_request:
    branches: [main, fremontderby-gamma]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-source-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR source branch topology
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          STRICT_RELEASE_SOURCE_POLICY: '1'
        run: node scripts/check-release-source-policy.mjs
