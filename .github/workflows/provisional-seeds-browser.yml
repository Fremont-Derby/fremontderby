name: Provisional seed browser regression
on:
  pull_request:
    paths: ['src/jflProvisionalSeed*.js', 'browser/jfl/provisional-seeds.spec.js', 'playwright.seed.config.mjs', '.github/workflows/provisional-seeds-browser.yml']
  push:
    branches: [fremontderby-jfl]
    paths: ['src/jflProvisionalSeed*.js', 'browser/jfl/provisional-seeds.spec.js', 'playwright.seed.config.mjs', '.github/workflows/provisional-seeds-browser.yml']
permissions:
  contents: read
jobs:
  provisional-seeds-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SEED_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config playwright.seed.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: provisional-seeds-browser-failure
          path: test-results/provisional-seeds/
          retention-days: 7
