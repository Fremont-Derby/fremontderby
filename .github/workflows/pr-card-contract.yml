name: PR card contract

# POC mode (#679): hosted Actions are temporarily unavailable. Keep the
# executable contract for later reactivation, but do not emit failed PR checks.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-card-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR coordination and exclusive card ownership
        id: contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-card-contract.mjs
      - name: Verify referenced cards are open repository issues
        uses: actions/github-script@v7
        env:
          TRACKING_CARD_NUMBERS: ${{ steps.contract.outputs.tracking-card-numbers }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const { validateTrackingCardLabels } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/check-pr-card-contract.mjs`
            ).href);
            const uniqueNumbers = JSON.parse(process.env.TRACKING_CARD_NUMBERS || '[]');

            for (const issueNumber of uniqueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (issue.pull_request) {
                core.setFailed(`#${issueNumber} is a pull request, not an implementation card.`);
              }
              if (issue.state !== 'open') {
                core.setFailed(`#${issueNumber} must remain open through post-merge verification.`);
              }

              const labelErrors = validateTrackingCardLabels(issue.labels);
              for (const error of labelErrors) {
                core.setFailed(`#${issueNumber}: ${error}`);
              }
            }
