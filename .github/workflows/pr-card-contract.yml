name: PR card contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PR coordination sections
        id: contract
        run: node scripts/check-pr-card-contract.mjs
      - name: Verify referenced cards are open repository issues
        uses: actions/github-script@v7
        env:
          TRACKING_CARD_NUMBERS: ${{ steps.contract.outputs.tracking-card-numbers }}
        with:
          script: |
            const uniqueNumbers = JSON.parse(process.env.TRACKING_CARD_NUMBERS || '[]');

            for (const issueNumber of uniqueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (issue.pull_request) {
                core.setFailed(`#${issueNumber} is a pull request, not an implementation card.`);
              }
              if (issue.state !== 'open') {
                core.setFailed(`#${issueNumber} must remain open through post-merge verification.`);
              }
            }
