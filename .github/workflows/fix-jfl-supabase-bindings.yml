name: Fix JFL Supabase bindings

on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]

concurrency:
  group: fix-jfl-supabase-bindings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ${{ inputs.runner_target || 'self-hosted' }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind JFL Worker to staging Supabase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LANE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/bind-jfl-staging-supabase.mjs
