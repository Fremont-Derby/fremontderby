name: Fix JFL Supabase bindings

# Points fremontderby-jfl Worker secrets at staging (oqkkvqkerusepyokzbmt).
on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]

concurrency:
  group: fix-jfl-supabase-bindings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ${{ inputs.runner_target || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare + lane service role
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LANE_SUPABASE_SERVICE_ROLE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN) { throw 'missing CLOUDFLARE_API_TOKEN' }
          if (-not $env:CLOUDFLARE_ACCOUNT_ID) { throw 'missing CLOUDFLARE_ACCOUNT_ID' }
          if (-not $env:LANE_SUPABASE_SERVICE_ROLE_KEY) { throw 'missing LANE_SUPABASE_SERVICE_ROLE_KEY' }
          Write-Host 'secrets present'
      - name: Put JFL staging SUPABASE_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: 'https://oqkkvqkerusepyokzbmt.supabase.co'
        run: node scripts/put-wrangler-secret.mjs SUPABASE_URL jfl
      - name: Put JFL EXPECTED_SUPABASE_PROJECT_REF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: 'oqkkvqkerusepyokzbmt'
        run: node scripts/put-wrangler-secret.mjs EXPECTED_SUPABASE_PROJECT_REF jfl
      - name: Put JFL staging publishable key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: pwsh
        run: |
          $pub = node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.jsonc','utf8');const m=t.match(/\"SUPABASE_PUBLISHABLE_KEY\":\\s*\"(sb_publishable_[^\"]+)\"/);if(!m)process.exit(2);process.stdout.write(m[1])"
          if (-not $pub) { throw 'could not parse publishable key from wrangler.jsonc' }
          $env:SECRET_VALUE = $pub
          node scripts/put-wrangler-secret.mjs SUPABASE_PUBLISHABLE_KEY jfl
      - name: Put JFL staging service role
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.LANE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/put-wrangler-secret.mjs SUPABASE_SERVICE_ROLE_KEY jfl
      - name: Verify JFL readiness
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 8; $i++) {
            try {
              $body = Invoke-RestMethod -Uri 'https://jfl.fremontderby.com/health/environment' -TimeoutSec 20
              Write-Host ($body | ConvertTo-Json -Compress)
              if ($body.ok -eq $true) { $ok = $true; break }
            } catch {
              Write-Host $_
            }
            Start-Sleep -Seconds 8
          }
          if (-not $ok) { throw 'JFL still not ok:true' }
          Write-Host 'JFL readiness OK'
