name: Fix JFL Supabase bindings

# Points fremontderby-jfl Worker secrets at staging (oqkkvqkerusepyokzbmt)
# where schema jfl exists. Uses Actions secrets; no chat tokens.
on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]

concurrency:
  group: fix-jfl-supabase-bindings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ${{ inputs.runner_target || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare + lane service role
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LANE_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo missing CLOUDFLARE_API_TOKEN; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo missing CLOUDFLARE_ACCOUNT_ID; exit 1; }
          test -n "$LANE_SUPABASE_SERVICE_ROLE_KEY" || { echo missing LANE_SUPABASE_SERVICE_ROLE_KEY; exit 1; }
          echo secrets present
      - name: Put JFL staging SUPABASE_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: 'https://oqkkvqkerusepyokzbmt.supabase.co'
        run: node scripts/put-wrangler-secret.mjs SUPABASE_URL jfl
      - name: Put JFL EXPECTED_SUPABASE_PROJECT_REF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: 'oqkkvqkerusepyokzbmt'
        run: node scripts/put-wrangler-secret.mjs EXPECTED_SUPABASE_PROJECT_REF jfl
      - name: Put JFL staging publishable key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.LANE_SUPABASE_PUBLISHABLE_KEY || secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            # Fallback: staging publishable from wrangler.jsonc (publishable, not service role)
            SECRET_VALUE=$(node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.jsonc','utf8');const m=t.match(/\"SUPABASE_PUBLISHABLE_KEY\":\\s*\"(sb_publishable_[^\"]+)\"/);if(!m)process.exit(2);process.stdout.write(m[1])")
            export SECRET_VALUE
          fi
          SECRET_VALUE="$SECRET_VALUE" node scripts/put-wrangler-secret.mjs SUPABASE_PUBLISHABLE_KEY jfl
      - name: Put JFL staging service role
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.LANE_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/put-wrangler-secret.mjs SUPABASE_SERVICE_ROLE_KEY jfl
      - name: Verify JFL readiness
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS "https://jfl.fremontderby.com/health/environment" || true)
            echo "$body" | head -c 400
            echo
            echo "$body" | grep -q '"ok":true' && echo JFL readiness OK && exit 0
            echo "wait $i"
            sleep 8
          done
          echo "JFL still not ok:true — secrets may need a new Worker version activation"
          exit 1
