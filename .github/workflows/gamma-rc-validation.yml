name: Gamma RC validation

# #581 — repeatable green/red check for the gamma release candidate before main promotion.
# Public probes only; no Cloudflare deploy secrets.
on:
  workflow_dispatch:
    inputs:
      expected_version_tag:
        description: Optional full/short Git SHA expected in gamma /health/environment versionTag
        required: false
        type: string
      gamma_base_url:
        description: Gamma public base URL
        required: false
        default: https://gamma.fremontderby.com
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gamma-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gamma-rc:
    name: gamma-rc
    runs-on: ${{ vars.FREMONT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate live gamma release candidate
        env:
          GAMMA_BASE_URL: ${{ github.event.inputs.gamma_base_url || 'https://gamma.fremontderby.com' }}
          EXPECTED_VERSION_TAG: ${{ github.event.inputs.expected_version_tag || '' }}
        run: node scripts/validate-gamma-rc.mjs

  # On PRs into main: also enforce release-source topology (gamma preferred).
  release-source:
    name: release-source
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.FREMONT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce gamma → main release source
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          STRICT_RELEASE_SOURCE_POLICY: '1'
        run: node scripts/check-release-source-policy.mjs
