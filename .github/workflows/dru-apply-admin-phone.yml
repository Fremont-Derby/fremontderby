name: DRU apply admin phone

on:
  pull_request:
    paths:
      - supabase/migrations/20261010191200_dru_set_admin_player_phone.sql
      - .github/workflows/dru-apply-admin-phone.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Fremont-Derby/fremontderby'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply DRU admin phone migration to staging
        env:
          SUPABASE_ACCESS_TOKEN2: ${{ secrets.SUPABASE_ACCESS_TOKEN2 }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN2" ]; then
            echo "secret missing"
            exit 1
          fi
          sql=$(cat supabase/migrations/20261010191200_dru_set_admin_player_phone.sql)
          payload=$(node -e 'const fs=require("fs"); const sql=fs.readFileSync(0,"utf8"); process.stdout.write(JSON.stringify({query:sql}))' <<< "$sql")
          code=$(curl -sS -o /tmp/apply.json -w '%{http_code}' \
            -X POST \
            -H "authorization: Bearer $SUPABASE_ACCESS_TOKEN2" \
            -H 'content-type: application/json' \
            --data "$payload" \
            'https://api.supabase.com/v1/projects/oqkkvqkerusepyokzbmt/database/query')
          echo "apply http $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "apply failed"
            exit 1
          fi
          verify='select p.proname, has_function_privilege('"'"'anon'"'"', p.oid, '"'"'execute'"'"') as anon_exec, has_function_privilege('"'"'authenticated'"'"', p.oid, '"'"'execute'"'"') as auth_exec, has_function_privilege('"'"'service_role'"'"', p.oid, '"'"'execute'"'"') as service_exec from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='"'"'dru'"'"' and p.proname='"'"'set_admin_player_phone'"'"''
          vcode=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            -X POST \
            -H "authorization: Bearer $SUPABASE_ACCESS_TOKEN2" \
            -H 'content-type: application/json' \
            --data "{\"query\":\"$verify\",\"read_only\":true}" \
            'https://api.supabase.com/v1/projects/oqkkvqkerusepyokzbmt/database/query')
          echo "verify http $vcode"
          node -e 'const rows=JSON.parse(require("fs").readFileSync("/tmp/verify.json","utf8")); if(!rows[0]||rows[0].anon_exec||rows[0].auth_exec||!rows[0].service_exec){console.log(JSON.stringify(rows)); process.exit(1)} console.log("dru.set_admin_player_phone service_role only")'
