name: Public surface canary

# Catches route/shell regressions after UI moves and deploys.
on:
  schedule:
    - cron: '10,40 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]
      canary_only:
        description: 'Optional host filter (comma names: production,www,gamma,dru,jfl). Empty = all.'
        required: false
        default: ''
        type: string

concurrency:
  group: public-surface-canary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ${{ github.event.inputs.runner_target || 'self-hosted' }}
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production DNS guard
        run: node scripts/assert-production-dns.mjs
      - name: Public HTML/JSON surface canary
        env:
          CANARY_ONLY: ${{ github.event.inputs.canary_only || '' }}
        run: node scripts/assert-public-surface.mjs
      - name: Open incident issue on failure
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[CANARY] Public surface or DNS regression';
            const body = [
              'Automated public surface canary failed.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check: `node scripts/assert-production-dns.mjs` and `node scripts/assert-public-surface.mjs`.',
              'Domain break-glass: **Restore lane custom domains**.',
              'See docs/apex-dns-incident-guard.md and docs/change-safety-net.md.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'canary',
              per_page: 5,
            });
            const existing = (issues.data || []).find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: run ${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['canary', 'priority:p1'],
              });
            }
