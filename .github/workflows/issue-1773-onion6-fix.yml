name: Issue 1773 Onion 6 fix

on:
  push:
    branches:
      - jfl/issue-1773-roster-expand-filter

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/issue-1773-onion6-fix.mjs
