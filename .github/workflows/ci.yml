name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failing test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1
      - run: npm run build
