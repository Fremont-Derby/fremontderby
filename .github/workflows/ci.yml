name: CI

on:
  pull_request:
  push:
    branches: [main, fremontderby-jfl, fremontderby-dru, fremontderby-gamma]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check
      - run: npm run labels:check
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failing test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1
      - run: npm run build

  accessibility:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run rendered WCAG2AA checks
        id: accessibility
        shell: bash
        run: |
          set +e
          npm run a11y 2>&1 | tee accessibility-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failing accessibility output
        if: failure() && steps.accessibility.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-output
          path: accessibility-output.txt
          retention-days: 1

  deploy-nonproduction:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/fremontderby-jfl' ||
       github.ref == 'refs/heads/fremontderby-dru' ||
       github.ref == 'refs/heads/fremontderby-gamma')
    needs: [test, accessibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy matching Cloudflare lane
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          lane="${GITHUB_REF_NAME#fremontderby-}"
          npm run "deploy:${lane}"
      - name: Verify deployed lane and exact commit
        shell: bash
        env:
          RELEASE_SMOKE_BYPASS_TOKEN: ${{ secrets.RELEASE_SMOKE_BYPASS_TOKEN }}
        run: |
          lane="${GITHUB_REF_NAME#fremontderby-}"
          node scripts/smoke-release.mjs \
            "https://${lane}.fremontderby.com" \
            "$lane" \
            "$GITHUB_SHA"

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, accessibility]
    runs-on: ubuntu-latest
    concurrency:
      group: production-smoke-main
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production commit and environment
        shell: bash
        env:
          RELEASE_SMOKE_BYPASS_TOKEN: ${{ secrets.RELEASE_SMOKE_BYPASS_TOKEN }}
        run: |
          node scripts/smoke-release.mjs \
            "https://fremontderby.com" \
            "prod" \
            "$GITHUB_SHA"
