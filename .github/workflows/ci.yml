name: CI

on:
  pull_request:
  push:
    branches: [main, fremontderby-jfl, fremontderby-dru, fremontderby-gamma]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check
      - run: npm run labels:check
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failing test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1
      - run: npm run build
      - name: Enforce test-file floor
        run: node scripts/count-tests.mjs

  deploy-nonproduction:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/fremontderby-jfl' ||
       github.ref == 'refs/heads/fremontderby-dru' ||
       github.ref == 'refs/heads/fremontderby-gamma')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy matching Cloudflare lane
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          lane="${GITHUB_REF_NAME#fremontderby-}"
          npm run "deploy:${lane}"
      - name: Verify deployed lane and exact commit
        shell: bash
        env:
          RELEASE_SMOKE_BYPASS_TOKEN: ${{ secrets.RELEASE_SMOKE_BYPASS_TOKEN }}
        run: |
          lane="${GITHUB_REF_NAME#fremontderby-}"
          node scripts/smoke-release.mjs \
            "https://${lane}.fremontderby.com" \
            "$lane" \
            "$GITHUB_SHA"

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: production-smoke-main
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production commit and environment
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION_TAG: ${{ github.sha }}
          RELEASE_SMOKE_BYPASS_TOKEN: ${{ secrets.RELEASE_SMOKE_BYPASS_TOKEN }}
        run: |
          set +e
          node scripts/smoke-release.mjs https://fremontderby.com production "$EXPECTED_VERSION_TAG" 2>&1 | tee smoke-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Record successful production release proof
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Production smoke passed for main commit \`${context.sha}\`.`,
              '',
              `Workflow: ${runUrl}`,
              '',
              'Verified automatically:',
              '- `/health` reported the exact Git SHA as `versionTag`;',
              '- `/health/environment` reported `production` with all readiness checks green;',
              '- `/demo` served the current Try a League Night surface.',
              '',
              'This is post-deploy evidence only; pre-merge CI and staging promotion remain separate release gates.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 245,
              body,
            });
      - name: Record actionable production smoke failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { pathToFileURL } = require('url');
            const {
              buildProductionSmokeFailureBody,
              findLatestProductionSmokeStatusComment,
            } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/production-smoke-incident.mjs`
            ).href);

            const title = '[RELEASE] Production smoke failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let diagnostics = 'Smoke output was unavailable.';
            try {
              diagnostics = fs.readFileSync('smoke-output.txt', 'utf8');
            } catch {}
            const body = buildProductionSmokeFailureBody({
              sha: context.sha,
              runUrl,
              diagnostics,
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            let issueNumber = existing?.number;
            if (!issueNumber) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Production release validation is failing.',
                  '',
                  'The latest automated evidence is maintained in the marker-owned status comment below.',
                  'Keep this incident open until an exact deployed-SHA production smoke passes.'
                ].join('\n'),
              });
              issueNumber = created.number;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const statusComment = findLatestProductionSmokeStatusComment(comments);
            if (statusComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: statusComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
      - name: Fail release validation
        if: steps.smoke.outcome == 'failure'
        run: exit 1
