name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failing test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1
      - run: npm run build

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production commit and environment
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION_TAG: ${{ github.sha }}
        run: |
          set +e
          node scripts/smoke-release.mjs https://fremontderby.com production "$EXPECTED_VERSION_TAG" 2>&1 | tee smoke-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Record successful production release proof
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Production smoke passed for main commit \`${context.sha}\`.`,
              '',
              `Workflow: ${runUrl}`,
              '',
              'Verified automatically:',
              '- `/health` reported the exact Git SHA as `versionTag`;',
              '- `/health/environment` reported `production` with all readiness checks green;',
              '- `/demo` served the current Try a League Night surface.',
              '',
              'This is post-deploy evidence only; pre-merge CI and staging promotion remain separate release gates.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 245,
              body,
            });
      - name: Record actionable production smoke failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[RELEASE] Production smoke failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let diagnostics = 'Smoke output was unavailable.';
            try {
              diagnostics = fs.readFileSync('smoke-output.txt', 'utf8').trim().slice(-6000) || diagnostics;
            } catch {}
            diagnostics = diagnostics.replace(/```/g, '``\u200b`');
            const body = [
              `Production smoke failed for main commit \`${context.sha}\`.`,
              '',
              `Workflow: ${runUrl}`,
              '',
              'Expected proof:',
              '- `/health` is healthy and reports the exact Git SHA as `versionTag`;',
              '- `/health/environment` reports `production` and all readiness checks pass;',
              '- `/demo` serves the current Try a League Night surface.',
              '',
              'Observed smoke diagnostics:',
              '```text',
              diagnostics,
              '```',
              '',
              'Do not promote another release until the deployed Worker/version and environment binding are reconciled.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail release validation
        if: steps.smoke.outcome == 'failure'
        run: exit 1
