name: Break-glass DRU Cloudflare build diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-dru-build-diagnostic.yml'
      - 'scripts/cloudflare-dru-build-diagnostic.mjs'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: startsWith(github.event.head_commit.message, '[BREAK-GLASS][P0][JFL] Diagnose failed DRU Cloudflare build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read latest failed DRU build and sanitized logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-dru-build-diagnostic.mjs
