name: Pre-Gamma convergence

on:
  pull_request:
    branches: [fremontderby-gamma]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-gamma-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: pre-gamma-convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate focused train ownership and exact-SHA proof
        run: node scripts/check-pre-gamma-convergence.mjs
