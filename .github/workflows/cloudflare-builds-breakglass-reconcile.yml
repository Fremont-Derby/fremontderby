name: Break-glass Cloudflare Workers Builds reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-builds-breakglass-reconcile.yml'

concurrency:
  group: cloudflare-workers-builds-breakglass-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    if: startsWith(github.event.head_commit.message, '[BREAK-GLASS][P0][JFL] Execute Cloudflare Builds live reconcile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require trusted source and least-privilege Builds token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_BUILDS_API_TOKEN"
      - name: Preflight all lanes without mutation
        id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          drift=false
          for lane in production jfl dru gamma; do
            set +e
            output=$(node scripts/configure-cloudflare-builds.mjs check "$lane" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              continue
            fi
            if printf '%s\n' "$output" | grep -q "Cloudflare Workers Builds drift detected for $lane"; then
              drift=true
              continue
            fi
            echo "::error::Preflight failed for $lane for a reason other than known configuration drift. Refusing mutation."
            exit "$status"
          done
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
      - name: Apply reviewed four-lane desired state
        if: steps.preflight.outputs.drift == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: node scripts/configure-cloudflare-builds.mjs apply all
      - name: Final four-lane check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: node scripts/configure-cloudflare-builds.mjs check all
