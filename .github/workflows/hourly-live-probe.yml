# Scheduled public endpoint probe; run on GitHub-hosted Linux by default.
# Manual dispatch can select a trusted self-hosted runner with bash installed.
name: Hourly live probe

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: [self-hosted, ubuntu-latest]

permissions:
  contents: read
  issues: write

concurrency:
  group: hourly-live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner_target || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production DNS + /health guard (apex + www)
        run: node scripts/assert-production-dns.mjs
      - name: Probe public routes
        env:
          PROBE_HOST: https://fremontderby.com
          PROBE_WWW: https://www.fremontderby.com
          PROBE_DRU: https://dru.fremontderby.com
          PROBE_JFL: https://jfl.fremontderby.com
          PROBE_GAMMA: https://gamma.fremontderby.com
        run: node scripts/hourly-live-probe.mjs
