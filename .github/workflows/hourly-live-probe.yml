# Backup probe when GitHub-hosted is down; CF cron remains primary.
name: Hourly live probe

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner'
        required: false
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]

permissions:
  contents: read
  issues: write

concurrency:
  group: hourly-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner_target || 'self-hosted' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public routes
        env:
          PROBE_HOST: https://fremontderby.com
          PROBE_DRU: https://dru.fremontderby.com
          PROBE_JFL: https://jfl.fremontderby.com
          PROBE_GAMMA: https://gamma.fremontderby.com
        run: node scripts/hourly-live-probe.mjs
