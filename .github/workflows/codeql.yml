name: CodeQL

# Keep analysis, but run lean so PR merges are not stuck in a long queue.
# Repo ruleset "Main block" still waits for *some* CodeQL results before merge;
# removing that wait is a human ruleset edit (see PR body).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Query suite from .github/codeql/codeql-config.yml (security-extended).
      # Pure JS Worker: no autobuild needed.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
