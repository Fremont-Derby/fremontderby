name: Seed JFL two-captain QA matchup

on:
  push:
    branches: [fremontderby-jfl]
    paths:
      - .github/workflows/seed-jfl-two-captain.yml
      - scripts/apply-jfl-two-captain.mjs
      - scripts/seed-jfl-two-captain.sql

permissions:
  contents: read

jobs:
  seed-jfl:
    if: github.repository == 'Fremont-Derby/fremontderby' && github.ref == 'refs/heads/fremontderby-jfl' && github.actor == 'subiki'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact trusted JFL source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply and read back JFL-only fixture through staging Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 }}
        run: node scripts/apply-jfl-two-captain.mjs
