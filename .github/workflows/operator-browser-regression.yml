name: Operator season browser regression
on:
  pull_request:
    paths:
      - 'src/chatModerationPage.js'
      - 'browser/jfl/chat-moderation-session.spec.js'
      - 'src/adminOperationsPage.js'
      - 'browser/jfl/admin-operations-session.spec.js'
      - 'src/adminGatewayPage.js'
      - 'browser/jfl/admin-gateway-session.spec.js'
      - 'src/seasonSetupPage.js'
      - 'src/lineupPage.js'
      - 'src/blindLineupComponent.js'
      - 'src/adminPlayersPage.js'
      - 'src/seasonPublishReadinessEnhancer.js'
      - 'src/seasonCloseEnhancer.js'
      - 'browser/jfl/operator-season-context.spec.js'
      - 'browser/jfl/operator-session-response.spec.js'
      - 'browser/jfl/season-creation-recovery.spec.js'
      - 'browser/jfl/requested-season-context.spec.js'
      - 'browser/jfl/lineup-session-context.spec.js'
      - '.github/workflows/operator-browser-regression.yml'
  push:
    branches: [fremontderby-jfl]
    paths:
      - 'src/chatModerationPage.js'
      - 'browser/jfl/chat-moderation-session.spec.js'
      - 'src/adminOperationsPage.js'
      - 'browser/jfl/admin-operations-session.spec.js'
      - 'src/adminGatewayPage.js'
      - 'browser/jfl/admin-gateway-session.spec.js'
      - 'src/seasonSetupPage.js'
      - 'src/lineupPage.js'
      - 'src/blindLineupComponent.js'
      - 'src/adminPlayersPage.js'
      - 'src/seasonPublishReadinessEnhancer.js'
      - 'src/seasonCloseEnhancer.js'
      - 'browser/jfl/operator-season-context.spec.js'
      - 'browser/jfl/operator-session-response.spec.js'
      - 'browser/jfl/season-creation-recovery.spec.js'
      - 'browser/jfl/requested-season-context.spec.js'
      - 'browser/jfl/lineup-session-context.spec.js'
      - '.github/workflows/operator-browser-regression.yml'
permissions:
  contents: read
jobs:
  operator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_OPERATOR_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser/jfl/chat-moderation-session.spec.js browser/jfl/admin-operations-session.spec.js browser/jfl/admin-gateway-session.spec.js browser/jfl/operator-season-context.spec.js browser/jfl/operator-session-response.spec.js browser/jfl/season-creation-recovery.spec.js browser/jfl/requested-season-context.spec.js browser/jfl/lineup-session-context.spec.js
      - run: npx wrangler deploy --dry-run --env=jfl --outdir dist
      - run: npx playwright test browser/jfl/season-creation-recovery.spec.js
        env:
          PLAYWRIGHT_OPERATOR_SOURCE: bundled
      - run: npx playwright test browser/jfl/requested-season-context.spec.js
        env:
          PLAYWRIGHT_CONTEXT_SOURCE: bundled
      - run: npx playwright test browser/jfl/lineup-session-context.spec.js
        env:
          PLAYWRIGHT_LINEUP_SOURCE: bundled
      - run: npx playwright test browser/jfl/admin-gateway-session.spec.js
        env:
          PLAYWRIGHT_GATEWAY_SOURCE: bundled
      - run: npx playwright test browser/jfl/admin-operations-session.spec.js
        env:
          PLAYWRIGHT_OPERATIONS_SOURCE: bundled
      - run: npx playwright test browser/jfl/chat-moderation-session.spec.js
        env:
          PLAYWRIGHT_MODERATION_SOURCE: bundled
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: operator-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
