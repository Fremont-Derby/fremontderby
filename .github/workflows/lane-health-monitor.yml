name: Lane health monitor
# DNS + environment identity. Self-hosted preferred while hosted runners are constrained.
on:
  schedule:
    # Every 15 minutes — catch apex DNS holes without waiting for a neighbor
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner (ubuntu-latest or self-hosted for laptop INFRA)'
        required: false
        default: 'self-hosted'
        type: choice
        options: [ubuntu-latest, self-hosted]
      check_cloudflare_bindings:
        description: 'Also run diagnose-worker-domains (needs CF secrets)'
        required: false
        default: true
        type: boolean

concurrency:
  group: lane-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner_target || 'self-hosted' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production DNS + /health guard (apex + www)
        run: node scripts/assert-production-dns.mjs
      - name: Assert lane environment identities
        run: node scripts/assert-lane-health.mjs
      - name: Public surface canary (all hosts)
        run: node scripts/assert-public-surface.mjs
      - name: Diagnose Worker custom domain bindings
        if: ${{ github.event_name == 'schedule' || github.event.inputs.check_cloudflare_bindings != 'false' }}
        continue-on-error: false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-worker-domains.mjs
