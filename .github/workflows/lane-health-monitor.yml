name: Lane health monitor
# POC mode (#679): manual only while GitHub-hosted runners are unavailable.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert lane environment identities
        run: node scripts/assert-lane-health.mjs
